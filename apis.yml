aid: textcortex
name: Textcortex
description: >-
  TextCortex is a Berlin-based AI writing and content-generation platform (ZenoChat
  assistant, knowledge bases, and a suite of writing tools) that also ships a public,
  OpenAI-compatible REST API. The API, served from https://api.textcortex.com/v1 with
  Bearer API-key authentication, exposes model discovery, chat completions, and an
  OpenAI Responses-compatible generation endpoint, plus an API-credit balance check.
  Streaming is supported over server-sent events and infrastructure is EU-hosted and
  GDPR-compliant. TextCortex is backed by Speedinvest and maintains first-party Python
  and JavaScript client libraries.
